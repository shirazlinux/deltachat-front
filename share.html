<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{if eq .Language "fa"}}rtl{{else}}ltr{{end}}">
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your ID</title>
    <link rel="stylesheet" href="./main.css">
    <script src="main.js"></script>
    <script src="translations.js"></script>
</head>
<body>
    <nav class="navbar glass-panel">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            <li><a href="privacy.html" data-i18n="nav_privacy">Privacy</a></li>
            <li><a href="security.html" data-i18n="nav_security">Security</a></li>
            <li><a href="apps/" data-i18n="nav_applications">applications</a></li>
            <li><a href="deploy.html" data-i18n="nav_deploy">Deploy</a></li>
            <li><a href="docs_index.html" data-i18n="nav_docs">Docs</a></li>
        </ul>
    </nav>
    
    <div class="glass-panel fade-in" style="text-align: center; display: inline-block; max-width: 800px; margin: 20px auto;">
        <h1 style="text-align: center;" data-i18n="share_title"></h1>
        <p style="color: var(--text-secondary);" data-i18n="share_subtitle"></p>

        <div style="margin-top: 30px;">
            <div class="input-container">
                <label for="share-name" data-i18n="share_name_label"></label>
                <input type="text" id="share-name" data-i18n-placeholder="share_name_placeholder" placeholder="Your name (optional)" style="max-width: 400px;">
            </div>

            <div class="input-container">
                <label for="share-slug" data-i18n="share_slug_label"></label>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <input type="text" id="share-slug" data-i18n-placeholder="share_slug_placeholder" placeholder="Path name (optional)" style="max-width: 300px;">
                    <button class="cta-button" onclick="generateRandomSlug()" style="padding: 12px 20px;" data-i18n="share_slug_random"></button>
                </div>
                <small style="color: var(--text-secondary); margin-top: 8px; display: block;" data-i18n="share_slug_hint"></small>
            </div>

            <div style="margin-top: 20px;">
                <button class="cta-button" onclick="createShareLink()" style="padding: 12px 30px; font-size: 1em;" data-i18n="share_submit"></button>
            </div>
        </div>

        <div class="manual-box" style="margin-top: 30px;">
            <p style="color: var(--text-secondary);" data-i18n-html="share_privacy"></p>
        </div>
    </div>

    <footer>
        DeltaChat Server
    </footer>
    
    <script>
        function generateRandomSlug() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let slug = '';
            for (let i = 0; i < 8; i++) {
                slug += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('share-slug').value = slug;
        }
        
        function createShareLink() {
            alert('Share functionality would be implemented here.');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations(document.documentElement.lang || 'en');
        });
    </script>
    <script>
        window.onload = function () { applyTranslations("{{.Language}}"); };
    </script>
</body>
</html>
