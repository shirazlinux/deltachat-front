<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{if eq .Language " fa"}}rtl{{else}}ltr{{end}}">
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="deploy_title">Deploy</title>
    <link rel="stylesheet" href="./main.css">
    <script src="main.js"></script>
    <script src="translations.js"></script>
</head>
<body>
    <nav class="navbar glass-panel">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            <li><a href="privacy.html" data-i18n="nav_privacy">Privacy</a></li>
            <li><a href="security.html" data-i18n="nav_security">Security</a></li>
            <li><a href="apps/index.html" data-i18n="nav_applications">applications</a></li>
            <li><a href="deploy.html" data-i18n="nav_deploy">Deploy</a></li>
            <li><a href="docs_index.html" data-i18n="nav_docs">Docs</a></li>
        </ul>
    </nav>
    
    <div class="glass-panel fade-in" style="text-align: center; display: inline-block; max-width: 800px; margin: 20px auto; line-height: 1.8;">
        <h1 style="text-align: center;" data-i18n="deploy_title"></h1>
        <p data-i18n-html="deploy_intro"></p>
        
        <h3 style="margin-top: 30px;" data-i18n="deploy_network_note"></h3>
        
        <h3 style="margin-top: 20px;" data-i18n="deploy_install_title"></h3>
        <p data-i18n-html="deploy_install_desc"></p>
        <div class="code-box" style="font-size: 0.85em;">
            <pre><code>curl https://chatmail-download.example.com/install.sh | bash</code></pre>
        </div>
        
        <h3 style="margin-top: 20px;" data-i18n="deploy_update_title"></h3>
        <p data-i18n-html="deploy_update_desc"></p>
        <div class="code-box" style="font-size: 0.85em;">
            <pre><code>curl https://chatmail-download.example.com/update.sh | bash</code></pre>
        </div>
        
        <h3 style="margin-top: 20px;" data-i18n="deploy_important_title"></h3>
        <div class="glass-panel" style="background: rgba(255,255,255,0.03); text-align: left;">
            <p data-i18n-html="deploy_important_ip"></p>
            <p data-i18n-html="deploy_important_ports"></p>
            <p data-i18n-html="deploy_important_config"></p>
        </div>
    </div>

    <footer>
        <span data-i18n="footer_version">Version</span> 2.0
    </footer>
    
    <script>
        window.onload = function () { applyTranslations("{{.Language}}"); };
    </script>
</body>
</html>
