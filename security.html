<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{if eq .Language "fa"}}rtl{{else}}ltr{{end}}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="security_title">Security & Privacy</title>
    <link rel="stylesheet" href="./main.css">
    <script src="main.js"></script>
    <script src="translations.js"></script>
</head>
<body>
    <nav class="navbar glass-panel">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            <li><a href="privacy.html" data-i18n="nav_privacy">Privacy</a></li>
            <li><a href="security.html" data-i18n="nav_security">Security</a></li>
            <li><a href="apps/" data-i18n="nav_applications">applications</a></li>
            <li><a href="deploy.html" data-i18n="nav_deploy">Deploy</a></li>
            <li><a href="docs_index.html" data-i18n="nav_docs">Docs</a></li>
        </ul>
    </nav>
    
    <div class="glass-panel fade-in" style="text-align: center; display: inline-block; max-width: 800px; margin: 20px auto; line-height: 1.8;">
        <h1 style="text-align: center;" data-i18n="security_title"></h1>
        <p style="font-size: 1.1em;" data-i18n-html="security_intro"></p>
        
        <h3 style="margin-top: 30px;" data-i18n="security_warning"></h3>
        
        <div class="glass-panel" style="background: rgba(255,255,255,0.03); text-align: left; margin-top: 20px;">
            <p data-i18n-html="security_classic_email"></p>
            <hr style="border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
            <p data-i18n-html="security_unsafe_msgs"></p>
            <hr style="border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
            <p data-i18n-html="security_start_chat"></p>
            <hr style="border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
            <p data-i18n-html="security_server_diff"></p>
            <hr style="border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
            <p data-i18n-html="security_admin_note"></p>
        </div>
    </div>

    <footer>
        <span data-i18n="footer_version">Version</span> 2.0
    </footer>
    
    <script>
        window.onload = function () { applyTranslations("{{.Language}}"); };
    </script>
</body>
</html>
