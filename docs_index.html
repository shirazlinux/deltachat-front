<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{if eq .Language " fa"}}rtl{{else}}ltr{{end}}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="docs_index_title">Documentation</title>
    <link rel="stylesheet" href="./main.css">
    <script src="main.js"></script>
    <script src="translations.js"></script>
</head>
<body>
    <nav class="navbar glass-panel">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            <li><a href="privacy.html" data-i18n="nav_privacy">Privacy</a></li>
            <li><a href="security.html" data-i18n="nav_security">Security</a></li>
            <li><a href="apps/" data-i18n="nav_applications">applications</a></li>
            <li><a href="deploy.html" data-i18n="nav_deploy">Deploy</a></li>
            <li><a href="docs_index.html" data-i18n="nav_docs">Docs</a></li>
        </ul>
    </nav>
    
    <div class="glass-panel fade-in" style="text-align: center; display: inline-block; max-width: 800px; margin: 20px auto;">
        <h1 style="text-align: center;" data-i18n="docs_index_title"></h1>
        <p data-i18n="docs_index_subtitle"></p>

        <div style="display: grid; gap: 20px; margin-top: 30px;">
            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='general_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_general"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_general_desc"></p>
            </div>

            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='admin_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_admin"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_admin_desc"></p>
            </div>

            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='admin_api_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_api"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_api_desc"></p>
            </div>

            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='database_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_database"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_database_desc"></p>
            </div>

            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='docker_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_docker"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_docker_desc"></p>
            </div>

            <div class="glass-panel" style="background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;" onclick="window.location='relay_docs.html'">
                <h3 style="margin-top: 0;" data-i18n="docs_relay"></h3>
                <p style="color: var(--text-secondary);" data-i18n="docs_relay_desc"></p>
            </div>
        </div>
    </div>

    <footer>
        <span data-i18n="footer_version">Version</span> 2.0
    </footer>
    
    <script>
        window.onload = function () { applyTranslations("{{.Language}}"); };
    </script>
</body>
</html>
